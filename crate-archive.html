<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crate Archive</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #161616;
  --surface2: #222;
  --surface3: #2a2a2a;
  --text: #f0f0f0;
  --text2: #999;
  --text3: #666;
  --accent: #1db954;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5}

.hdr{position:sticky;top:0;z-index:200;background:rgba(10,10,10,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 20px 10px}
.hdr-top{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
.hdr-title{font-size:17px;font-weight:700;letter-spacing:-.02em}
.hdr-stats{font-size:11px;color:var(--text3);letter-spacing:.02em}
.search-row{display:flex;gap:6px;align-items:center}
#search{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:7px 12px;outline:none;transition:border .15s}
#search::placeholder{color:var(--text3)}
#search:focus{border-color:rgba(29,185,84,.5)}
.ftoggle{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:11px;padding:7px 10px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.ftoggle:hover,.ftoggle.on{color:var(--text);border-color:rgba(255,255,255,.2)}
.filters{display:none;margin-top:8px;gap:10px 20px;flex-wrap:wrap;font-size:11px;color:var(--text2);align-items:center}
.filters.open{display:flex}
.filters select,.filters input[type=number]{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:11px;outline:none}
.filters label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.fgroup{display:flex;align-items:center;gap:6px}
.result-bar{font-size:11px;color:var(--text3);padding:6px 20px 0;display:none}
.result-bar.visible{display:block}

#library{max-width:960px;margin:0 auto;padding:8px 16px 60px}

.pl{border-bottom:1px solid var(--border2);cursor:pointer;user-select:none}
.pl-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;transition:background .1s}
.pl-row:hover{background:var(--surface)}
.pl.open>.pl-row{background:var(--surface)}
.pl-cover{width:44px;height:44px;object-fit:cover;border-radius:3px;flex-shrink:0;background:var(--surface2)}
.pl-cover-empty{width:44px;height:44px;border-radius:3px;flex-shrink:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:18px}
.pl-info{flex:1;min-width:0}
.pl-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-meta{font-size:11px;color:var(--text3);margin-top:1px}
.pl-link{color:var(--accent);font-size:11px;text-decoration:none;flex-shrink:0;opacity:.7;transition:opacity .15s}
.pl-link:hover{opacity:1;text-decoration:underline}
.pl-chevron{color:var(--text3);font-size:11px;flex-shrink:0;transition:transform .2s;width:16px;text-align:center}
.pl.open .pl-chevron{transform:rotate(90deg)}

.tl{display:none}
.pl.open .tl{display:block}
.tr{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 62px;font-size:12px;border-bottom:1px solid var(--border2);transition:background .1s}
.tr:last-child{border-bottom:none}
.tr:hover{background:var(--surface2)}
.tr-num{width:22px;text-align:right;color:var(--text3);font-size:11px;flex-shrink:0;font-variant-numeric:tabular-nums}
.tr-title{flex:2;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tr-artist{flex:2;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tr-link{color:var(--accent);font-size:11px;text-decoration:none;flex-shrink:0;opacity:0;transition:opacity .15s;width:16px;text-align:center}
.tr:hover .tr-link{opacity:.7}
.tr-link:hover{opacity:1}
mark{background:rgba(29,185,84,.25);color:inherit;border-radius:2px;padding:0 1px}
.no-results{padding:60px 20px;text-align:center;color:var(--text3);font-size:13px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-title">Crate Archive</div>
    <div class="hdr-stats">198 Playlists&ensp;/&ensp;4,707 Playlist tracks&ensp;/&ensp;971 Liked Songs</div>
  </div>
  <div class="search-row">
    <input id="search" type="text" placeholder="Search tracks, artists, playlists…" autocomplete="off" spellcheck="false">
    <button class="ftoggle" id="ftoggle">More filters</button>
  </div>
  <div class="filters" id="filters">
    <div class="fgroup"><span>Search in:</span>
      <select id="scope">
        <option value="all">titles + artists + playlists</option>
        <option value="title">track titles only</option>
        <option value="artist">artists only</option>
        <option value="playlist">playlist names only</option>
      </select>
    </div>
    <div class="fgroup"><span>Match:</span>
      <select id="matchmode">
        <option value="words">any word</option>
        <option value="exact">exact phrase</option>
        <option value="all">all words</option>
      </select>
    </div>
    <div class="fgroup">
      <label><input id="expandall" type="checkbox"> Expand all matches</label>
    </div>
  </div>
</div>
<div class="result-bar" id="result-bar"></div>
<div id="library"><div class="no-results">Loading…</div></div>

<script>
'use strict';
async function decode(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream('gzip'), w = ds.writable.getWriter();
  w.write(bytes); w.close();
  const chunks = [], r = ds.readable.getReader();
  for (;;) { const {done,value} = await r.read(); if (done) break; chunks.push(value); }
  const total = chunks.reduce((n,c)=>n+c.length,0), out = new Uint8Array(total);
  let off = 0; for (const c of chunks){out.set(c,off);off+=c.length;}
  return JSON.parse(new TextDecoder().decode(out));
}

const $=id=>document.getElementById(id);
let query='',scope='all',matchmode='words',expandall=false;
$('search').addEventListener('input',e=>{query=e.target.value.trim();renderAll();});
$('scope').addEventListener('change',e=>{scope=e.target.value;renderAll();});
$('matchmode').addEventListener('change',e=>{matchmode=e.target.value;renderAll();});
$('expandall').addEventListener('change',e=>{expandall=e.target.checked;renderAll();});
$('ftoggle').addEventListener('click',()=>{
  const f=$('filters');f.classList.toggle('open');
  $('ftoggle').classList.toggle('on',f.classList.contains('open'));
});

function makeTerms(q){
  if(matchmode==='exact') return [q.toLowerCase()];
  return q.toLowerCase().split(/\s+/).filter(Boolean);
}
function highlight(text,terms){
  let r=escH(text);
  for(const t of terms) r=r.replace(new RegExp(escRe(escH(t)),'gi'),m=>`<mark>${m}</mark>`);
  return r;
}
function escH(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function trackMatches(t,terms,plName){
  if(!terms.length) return true;
  const has=(h,n)=>h.toLowerCase().includes(n);
  if(matchmode==='all') return terms.every(n=>{
    if(scope==='all') return has(t.title,n)||has(t.artist,n)||has(plName,n);
    if(scope==='title') return has(t.title,n);
    if(scope==='artist') return has(t.artist,n);
    if(scope==='playlist') return has(plName,n);
  });
  return terms.some(n=>{
    if(scope==='all') return has(t.title,n)||has(t.artist,n)||has(plName,n);
    if(scope==='title') return has(t.title,n);
    if(scope==='artist') return has(t.artist,n);
    if(scope==='playlist') return has(plName,n);
  });
}

function renderAll(){
  if(!ALL.length) return;
  const terms=query?makeTerms(query):[];
  const searching=terms.length>0;
  let totalTracks=0,totalPls=0;
  const frag=document.createDocumentFragment();

  for(const pl of ALL){
    let matched;
    if(!searching){matched=null;}
    else{
      matched=pl.tracks.filter(t=>trackMatches(t,terms,pl.name));
      if(matched.length===0&&!(scope==='playlist'&&terms.some(t=>pl.name.toLowerCase().includes(t)))) continue;
    }
    const tracks=matched!==null?matched:pl.tracks;
    totalTracks+=tracks.length; totalPls++;
    const autoOpen=searching&&expandall&&matched&&matched.length>0;

    const div=document.createElement('div');
    div.className='pl'+(autoOpen?' open':'');
    const coverHtml=pl.cover
      ?`<img class="pl-cover" src="${pl.cover}" loading="lazy" alt="">`
      :`<div class="pl-cover-empty">♫</div>`;
    const nameHl=terms.length&&(scope==='all'||scope==='playlist')?highlight(pl.name,terms):escH(pl.name);
    div.innerHTML=`
      <div class="pl-row">
        ${coverHtml}
        <div class="pl-info">
          <div class="pl-name">${nameHl}</div>
          <div class="pl-meta">${tracks.length} track${tracks.length!==1?'s':''}${pl.isLiked?' · Liked Songs':''}</div>
        </div>
        ${pl.url?`<a class="pl-link" href="${pl.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open ↗</a>`:''}
        <div class="pl-chevron">›</div>
      </div>
      <div class="tl">${renderTracks(tracks,terms)}</div>`;
    div.querySelector('.pl-row').addEventListener('click',()=>div.classList.toggle('open'));
    frag.appendChild(div);
  }

  const lib=$('library');
  lib.innerHTML='';
  if(totalPls===0){lib.innerHTML='<div class="no-results">No matches found.</div>';}
  else{lib.appendChild(frag);}

  const rb=$('result-bar');
  if(searching){
    rb.textContent=`${totalTracks.toLocaleString()} tracks across ${totalPls} playlist${totalPls!==1?'s':''}`;
    rb.classList.add('visible');
  } else {rb.classList.remove('visible');}
}

function renderTracks(tracks,terms){
  if(!tracks.length) return '<div class="no-results" style="padding:12px 8px 12px 62px">No tracks</div>';
  return tracks.map((t,i)=>{
    const titleHl=terms.length&&(scope==='all'||scope==='title')?highlight(t.title,terms):escH(t.title);
    const artistHl=terms.length&&(scope==='all'||scope==='artist')?highlight(t.artist,terms):escH(t.artist);
    const link=t.url
      ?`<a class="tr-link" href="${t.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open in Spotify">↗</a>`
      :`<span class="tr-link" title="Local file">·</span>`;
    return `<div class="tr">
      <span class="tr-num">${i+1}</span>
      <span class="tr-title">${titleHl}</span>
      <span class="tr-artist">${artistHl}</span>
      ${link}
    </div>`;
  }).join('');
}
</script>
</body>
</html>
