<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bryndal.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0b0e;
      color: #ededf0;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo {
      font-family: 'Syne', system-ui, sans-serif;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.03em;
      color: #ededf0;
      text-decoration: none;
    }

    .logo em { color: #a78bfa; font-style: normal; }

    .header-right {
      font-size: 11px;
      color: #44445a;
      letter-spacing: 0.06em;
    }

    main {
      flex: 1;
      padding: 40px;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #44445a;
      margin-bottom: 16px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 28px 28px 24px;
      transition: border-color 0.2s, background 0.2s;
    }

    .card:hover {
      border-color: rgba(167, 139, 250, 0.4);
      background: rgba(167, 139, 250, 0.04);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .tag {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.12);
      padding: 4px 10px;
      border-radius: 4px;
    }

    .date {
      font-size: 11px;
      color: #44445a;
    }

    .card-title {
      font-family: 'Syne', system-ui, sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #ededf0;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 13px;
      color: #8080a0;
      font-weight: 300;
      margin-bottom: 24px;
    }

    .open {
      font-size: 13px;
      font-weight: 500;
      color: #a78bfa;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: gap 0.15s;
    }

    .card:hover .open { gap: 9px; }

    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
    }

    footer span { font-size: 11px; color: #2e2e3e; }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="/">bryndal<em>.ai</em></a>
    <span class="header-right">made with claude</span>
  </header>

  <main>
    <div class="section-label">Apps</div>

    <a class="card" href="https://scentshelf.bryndal.ai">
      <div class="card-head">
        <span class="tag">Fragrance</span>
        <span class="date">Jul 2026</span>
      </div>
      <div class="card-title">Scent Shelf</div>
      <div class="card-desc">A curated cologne collection — notes, profiles, and recommendations.</div>
      <span class="open">Open →</span>
    </a>

    <div class="section-label" style="margin-top: 44px;">Archive</div>

    <a class="card" href="/crate-archive.html">
      <div class="card-head">
        <span class="tag">Music</span>
        <span class="date">Jul 2026</span>
      </div>
      <div class="card-title">Crate Archive</div>
      <div class="card-desc">My full Spotify library, searchable and offline.</div>
      <span class="open">Open →</span>
    </a>
  </main>

  <footer>
    <span>© 2026 Kristina Bryndal</span>
    <span>bryndal.ai</span>
  </footer>

</body>
</html>
