<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>The Unicorn</title>
<style>
  :root { --ink:#f4efe4; --gold:#e9c46a; --panel:rgba(18,26,38,.82); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0e1622; color:var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; touch-action:none;
    -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #hud { position:fixed; inset:0; pointer-events:none; padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left)); display:none; }
  #hud.on { display:block; }
  .bar { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .pill { background:var(--panel); border-radius:12px; padding:8px 12px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #title { font-size:17px; letter-spacing:.02em; }
  #status { font:13px/1.5 system-ui,sans-serif; opacity:.95; display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:3px; }
  .dot { display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid currentColor; margin-right:3px; vertical-align:-2px; }
  .dot.have { background:currentColor; }
  .btns { display:flex; gap:6px; pointer-events:auto; }
  button { font:600 15px system-ui,sans-serif; color:var(--ink); background:var(--panel); border:1px solid rgba(255,255,255,.18);
    border-radius:12px; min-width:46px; height:46px; padding:0 12px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  button:active { transform:scale(.95); }
  #floorbox { position:absolute; right:max(12px,env(safe-area-inset-right)); top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:auto; }
  #floorlbl { font:600 12px system-ui,sans-serif; text-align:center; background:var(--panel); border-radius:10px; padding:6px 8px; }
  #toast { position:absolute; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translateX(-50%); max-width:min(560px,86vw);
    text-align:center; font-size:16px; line-height:1.35; padding:10px 16px; opacity:0; transition:opacity .4s; }
  #toast.on { opacity:1; }
  #stick { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; border:2px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08); display:none; pointer-events:none; }
  #nub { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:rgba(255,255,255,.55); }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:18px;
    background:radial-gradient(ellipse at 50% 30%, rgba(40,58,84,.88), rgba(8,12,20,.96)); overflow:auto; touch-action:pan-y; }
  #overlay.off { display:none; }
  .sheet { width:min(860px,100%); margin:auto; }
  h1 { font-size:clamp(30px,6vw,52px); margin:0 0 4px; font-weight:400; letter-spacing:.01em; }
  h1 em { color:var(--gold); font-style:italic; }
  .sub { font-size:16px; opacity:.8; margin:0 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .card { text-align:left; height:auto; min-height:104px; padding:14px; border-radius:14px; font-family:inherit; font-weight:400; }
  .card b { display:block; font-size:19px; font-weight:400; margin-bottom:4px; }
  .card small { font:12.5px/1.35 system-ui,sans-serif; opacity:.75; display:block; }
  .card .num { font:600 11px system-ui,sans-serif; letter-spacing:.14em; color:var(--gold); text-transform:uppercase; }
  .card.locked { opacity:.38; cursor:not-allowed; }
  .card.sel { outline:3px solid var(--gold); }
  .how { margin-top:18px; font:13.5px/1.55 system-ui,sans-serif; opacity:.86; display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:6px 22px; }
  .how i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .how b { color:var(--gold); font-weight:600; }
  .win { text-align:center; }
  .win p { font-size:18px; opacity:.9; }
  .win .row { display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
  .win button { height:52px; padding:0 22px; font-size:17px; }
  .primary { background:var(--gold); color:#1a1408; border-color:transparent; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="bar">
    <div class="pill">
      <div id="title"></div>
      <div id="status"></div>
    </div>
    <div class="btns">
      <button id="bRestart" title="Restart level">↺</button>
      <button id="bMenu" title="Levels">☰</button>
    </div>
  </div>
  <div id="toast" class="pill"></div>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<script type="module" src="game.js?v=13"></script>
</body>
</html>
